<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Haskell 学びクイズ</title>

  <!-- Premium Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Canvas Confetti CDN -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <!-- Manifest (static load) -->
  <script src="data/manifest.js"></script>

  <style>
    /* Reset & CSS Variables */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg-primary: #080c14;
      --bg-secondary: #0f172a;
      --bg-glass: rgba(15, 23, 42, 0.65);
      --bg-glass-hover: rgba(30, 41, 59, 0.8);
      --border-color: rgba(255, 255, 255, 0.08);
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;

      --accent-primary: #6366f1;
      --accent-secondary: #a855f7;
      --accent-success: #10b981;
      --accent-error: #f43f5e;

      --glow-accent: rgba(99, 102, 241, 0.25);
      --glow-success: rgba(16, 185, 129, 0.25);
      --glow-error: rgba(244, 63, 94, 0.25);

      --transition-smooth: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      position: relative;
      padding: 2rem 1rem;
    }

    /* Ambient Gradients */
    body::before, body::after {
      content: '';
      position: absolute;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      background: radial-gradient(circle, var(--accent-primary) 0%, rgba(99, 102, 241, 0) 70%);
      opacity: 0.15;
      z-index: -1;
      filter: blur(80px);
      pointer-events: none;
    }

    body::before { top: -10%; left: -10%; }
    body::after { bottom: -10%; right: -10%; background: radial-gradient(circle, var(--accent-secondary) 0%, rgba(168, 85, 247, 0) 70%); opacity: 0.12; }

    .app-container {
      width: 100%;
      max-width: 680px;
      z-index: 10;
    }

    header {
      text-align: center;
      margin-bottom: 2rem;
      animation: fadeInDown 0.6s ease-out;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.15) 0%, rgba(168, 85, 247, 0.15) 100%);
      border: 1px solid rgba(99, 102, 241, 0.3);
      padding: 0.4rem 1rem;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      color: #a5b4fc;
      margin-bottom: 1rem;
    }

    h1 {
      font-size: 2.2rem;
      font-weight: 800;
      line-height: 1.25;
      background: linear-gradient(135deg, #ffffff 30%, #c7d2fe 70%, #e0a7ff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.5rem;
      letter-spacing: -0.02em;
    }

    .subtitle { color: var(--text-secondary); font-size: 1rem; }

    /* Progress Tracker */
    .progress-wrapper { margin-bottom: 1.5rem; }
    .progress-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.5rem;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-secondary);
    }
    .progress-bar-container {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.03);
    }
    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent-primary) 0%, var(--accent-secondary) 100%);
      border-radius: 10px;
      transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 0 12px var(--accent-primary);
    }

    /* Main Card */
    .card {
      background: var(--bg-glass);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border-color);
      border-radius: 24px;
      padding: 2.5rem;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      min-height: 380px;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .question-screen { display: flex; flex-direction: column; height: 100%; flex-grow: 1; }
    .question-number { font-size: 0.85rem; font-weight: 700; text-transform: uppercase; color: var(--accent-secondary); margin-bottom: 0.75rem; }
    .question-text { font-size: 1.25rem; font-weight: 700; line-height: 1.5; margin-bottom: 1.5rem; color: var(--text-primary); }

    pre {
      background: #090d16;
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      padding: 1.2rem;
      margin-bottom: 1.5rem;
      overflow-x: auto;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.9rem;
      line-height: 1.6;
      color: #e2e8f0;
      position: relative;
    }
    .code-lang { position: absolute; top: 6px; right: 12px; font-size: 0.7rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; }

    /* Choices */
    .choices-list { display: grid; grid-template-columns: 1fr; gap: 0.85rem; margin-bottom: 1.5rem; }
    .choice-card {
      background: rgba(255, 255, 255, 0.02);
      border: 1.5px solid var(--border-color);
      border-radius: 16px;
      padding: 1rem 1.25rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      cursor: pointer;
      font-weight: 600;
      color: var(--text-primary);
      transition: var(--transition-smooth);
      text-align: left;
      outline: none;
    }
    .choice-card:hover:not(.checked) {
      background: var(--bg-glass-hover);
      border-color: var(--accent-primary);
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(99, 102, 241, 0.15);
    }
    .choice-index {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-secondary);
      flex-shrink: 0;
    }
    .choice-card:hover:not(.checked) .choice-index { background: var(--accent-primary); border-color: var(--accent-primary); color: white; }

    .choice-card.correct { background: rgba(16, 185, 129, 0.1); border-color: var(--accent-success); box-shadow: 0 8px 24px var(--glow-success); }
    .choice-card.correct .choice-index { background: var(--accent-success); border-color: var(--accent-success); color: white; }
    .choice-card.incorrect { background: rgba(244, 63, 94, 0.08); border-color: var(--accent-error); box-shadow: 0 8px 24px var(--glow-error); opacity: 0.7; }
    .choice-card.incorrect .choice-index { background: var(--accent-error); border-color: var(--accent-error); color: white; }
    .choice-card.dimmed { opacity: 0.4; cursor: not-allowed; }

    /* Explanation Panel */
    .explanation-panel {
      margin-top: 1.5rem;
      background: rgba(255, 255, 255, 0.02);
      border: 1px dashed rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 1.25rem;
      animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      display: none;
    }
    .explanation-header { display: flex; align-items: center; gap: 0.5rem; font-weight: 700; margin-bottom: 0.5rem; }
    .explanation-header.correct-text { color: var(--accent-success); }
    .explanation-header.incorrect-text { color: var(--accent-error); }
    .explanation-body { font-size: 0.9rem; line-height: 1.6; color: var(--text-secondary); }

    .action-container { margin-top: auto; display: flex; justify-content: flex-end; padding-top: 1rem; }
    .btn {
      background: linear-gradient(135deg, var(--accent-primary) 0%, var(--accent-secondary) 100%);
      border: none;
      color: white;
      padding: 0.85rem 1.8rem;
      border-radius: 14px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      transition: var(--transition-smooth);
      box-shadow: 0 8px 20px rgba(99, 102, 241, 0.3);
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 12px 28px rgba(99, 102, 241, 0.45); }

    .btn-ghost {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-color);
      color: var(--text-secondary);
      box-shadow: none;
    }
    .btn-ghost:hover {
      background: var(--bg-glass-hover);
      color: var(--text-primary);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
    }

    /* Results */
    .results-screen { text-align: center; display: none; flex-direction: column; align-items: center; justify-content: center; animation: scaleIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1); }
    .trophy-icon { color: #eab308; width: 72px; height: 72px; filter: drop-shadow(0 4px 12px rgba(234, 179, 8, 0.4)); margin-bottom: 1.5rem; }
    .results-title { font-size: 1.8rem; font-weight: 800; margin-bottom: 0.5rem; background: linear-gradient(135deg, #ffffff, #c7d2fe); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .results-stats { display: flex; gap: 1.5rem; margin: 1.5rem 0; }
    .stat-box { background: rgba(255, 255, 255, 0.02); border: 1px solid var(--border-color); border-radius: 16px; padding: 1rem 1.5rem; min-width: 120px; }
    .stat-val { font-size: 1.8rem; font-weight: 800; color: var(--accent-primary); }
    .stat-val.success-color { color: var(--accent-success); }
    .stat-lbl { font-size: 0.8rem; color: var(--text-secondary); font-weight: 600; text-transform: uppercase; }
    .results-message { color: var(--text-secondary); font-size: 1rem; margin-bottom: 2rem; max-width: 440px; }
    .results-actions { display: flex; gap: 1rem; flex-wrap: wrap; justify-content: center; }

    /* Syntax Highlighting */
    .keyword { color: #f472b6; font-weight: bold; }
    .comment { color: #64748b; font-style: italic; }

    /* ===== Dashboard (new screen, same design tone) ===== */
    .dashboard-screen { display: flex; flex-direction: column; gap: 1.5rem; animation: fadeInDown 0.5s ease-out; }
    .dash-section-title {
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--accent-secondary);
      margin-bottom: 0.85rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .dash-block {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--border-color);
      border-radius: 18px;
      padding: 1.25rem 1.4rem;
    }
    .latest-meta { color: var(--text-secondary); font-size: 0.9rem; margin-bottom: 1rem; line-height: 1.5; }
    .latest-meta strong { color: var(--text-primary); font-weight: 700; }
    .latest-date { color: var(--accent-secondary); font-weight: 700; font-size: 0.85rem; }

    .review-controls { display: flex; align-items: center; gap: 0.85rem; flex-wrap: wrap; }
    .review-controls label { font-size: 0.9rem; font-weight: 600; color: var(--text-secondary); }
    .select-input {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      font-family: inherit;
      font-weight: 600;
      font-size: 0.9rem;
      padding: 0.6rem 0.9rem;
      border-radius: 12px;
      cursor: pointer;
      outline: none;
    }
    .select-input:focus { border-color: var(--accent-primary); }

    .quiz-list { display: flex; flex-direction: column; gap: 0.6rem; }
    .quiz-list-item {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 0.85rem 1.1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      cursor: pointer;
      transition: var(--transition-smooth);
      text-align: left;
      width: 100%;
      color: inherit;
      font-family: inherit;
    }
    .quiz-list-item:hover {
      background: var(--bg-glass-hover);
      border-color: var(--accent-primary);
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(99, 102, 241, 0.15);
    }
    .quiz-list-main { display: flex; flex-direction: column; gap: 0.15rem; min-width: 0; }
    .quiz-list-date { font-size: 0.78rem; font-weight: 700; color: var(--accent-secondary); }
    .quiz-list-title { font-size: 0.95rem; font-weight: 600; color: var(--text-primary); overflow: hidden; text-overflow: ellipsis; }
    .quiz-list-count {
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--text-secondary);
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 0.3rem 0.75rem;
      white-space: nowrap;
      flex-shrink: 0;
    }

    @keyframes fadeInDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes scaleIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }

    footer { text-align: center; margin-top: 1.5rem; font-size: 0.8rem; color: var(--text-muted); }
  </style>
</head>
<body>

  <div class="app-container">

    <header>
      <div class="badge">
        <i data-lucide="book-open" style="width: 14px; height: 14px;"></i>
        <span>Haskell Learning Review</span>
      </div>
      <h1 id="app-title">Haskell 学びクイズ</h1>
      <p class="subtitle" id="app-subtitle">日々の学びを4択で振り返る</p>
    </header>

    <!-- Progress Tracker (quiz mode only) -->
    <div class="progress-wrapper" id="progress-wrapper" style="display: none;">
      <div class="progress-meta">
        <span id="current-question-num">Question 1 of 3</span>
        <span id="score-meta">Score: 0 / 0</span>
      </div>
      <div class="progress-bar-container">
        <div class="progress-bar-fill" id="progress-bar"></div>
      </div>
    </div>

    <div class="card" id="quiz-card">

      <!-- Dashboard Screen -->
      <div class="dashboard-screen" id="dashboard-screen">

        <div>
          <div class="dash-section-title">
            <i data-lucide="sparkles" style="width: 14px; height: 14px;"></i>
            <span>最新のクイズ</span>
          </div>
          <div class="dash-block">
            <p class="latest-meta">
              <span class="latest-date" id="latest-date"></span><br>
              <strong id="latest-title"></strong>
            </p>
            <button class="btn" id="start-latest-btn">
              <i data-lucide="play" style="width: 18px; height: 18px;"></i>
              <span>最新のクイズを始める</span>
            </button>
          </div>
        </div>

        <div>
          <div class="dash-section-title">
            <i data-lucide="repeat" style="width: 14px; height: 14px;"></i>
            <span>復習モード</span>
          </div>
          <div class="dash-block">
            <div class="review-controls">
              <label for="review-count">問題数</label>
              <select class="select-input" id="review-count">
                <option value="5">5問</option>
                <option value="10" selected>10問</option>
                <option value="20">20問</option>
              </select>
              <button class="btn" id="start-review-btn">
                <i data-lucide="shuffle" style="width: 18px; height: 18px;"></i>
                <span>復習を始める</span>
              </button>
            </div>
          </div>
        </div>

        <div>
          <div class="dash-section-title">
            <i data-lucide="history" style="width: 14px; height: 14px;"></i>
            <span>過去のクイズ</span>
          </div>
          <div class="quiz-list" id="quiz-list"></div>
        </div>

      </div>

      <!-- Quiz Screen -->
      <div class="question-screen" id="question-screen" style="display: none;">
        <div class="question-number" id="screen-q-num">Question 1</div>
        <div class="question-text" id="screen-q-text">質問テキスト</div>

        <pre><div class="code-lang">haskell</div><code id="code-snippet">コード</code></pre>

        <div class="choices-list" id="choices-container"></div>

        <div class="explanation-panel" id="explanation-panel">
          <div class="explanation-header" id="explanation-title"></div>
          <div class="explanation-body" id="explanation-text"></div>
        </div>

        <div class="action-container" id="action-container" style="display: none;">
          <button class="btn" id="next-btn">
            <span>Next Question</span>
            <i data-lucide="arrow-right" style="width: 18px; height: 18px;"></i>
          </button>
        </div>
      </div>

      <!-- Results Screen -->
      <div class="results-screen" id="results-screen">
        <i data-lucide="trophy" class="trophy-icon"></i>
        <h2 class="results-title">Quiz Completed!</h2>
        <p class="results-message" id="results-achievement-text">素晴らしい！今日のHaskellの学びが身についています！</p>

        <div class="results-stats">
          <div class="stat-box">
            <div class="stat-val success-color" id="final-score">3 / 3</div>
            <div class="stat-lbl">正解数</div>
          </div>
          <div class="stat-box">
            <div class="stat-val" id="final-accuracy">100%</div>
            <div class="stat-lbl">正解率</div>
          </div>
        </div>

        <div class="results-actions">
          <button class="btn" id="retry-btn">
            <i data-lucide="rotate-ccw" style="width: 18px; height: 18px;"></i>
            <span>もう一度挑戦する</span>
          </button>
          <button class="btn btn-ghost" id="home-btn">
            <i data-lucide="home" style="width: 18px; height: 18px;"></i>
            <span>ダッシュボードへ戻る</span>
          </button>
        </div>
      </div>

    </div>

    <footer>
      <p>Created by Antigravity</p>
    </footer>

  </div>

  <script>
    // ===================================================================
    // Data loading (file:// safe — dynamic <script> append, no fetch/XHR)
    // ===================================================================
    window.QUIZ_DATA = window.QUIZ_DATA || {};
    const MANIFEST = window.QUIZ_MANIFEST || [];
    const loadedFiles = {}; // date -> Promise (dedupe; never reload a file)

    function loadDataFile(date) {
      if (loadedFiles[date]) return loadedFiles[date];
      // Already present (e.g. loaded earlier) — resolve immediately.
      if (window.QUIZ_DATA[date]) {
        loadedFiles[date] = Promise.resolve();
        return loadedFiles[date];
      }
      loadedFiles[date] = new Promise((resolve, reject) => {
        const s = document.createElement("script");
        s.src = `data/${date}.js`;
        s.onload = () => resolve();
        s.onerror = () => reject(new Error(`Failed to load data/${date}.js`));
        document.head.appendChild(s);
      });
      return loadedFiles[date];
    }

    // ===================================================================
    // localStorage history (UI-less; failures are non-fatal)
    // ===================================================================
    const HISTORY_KEY = "haskellQuizHistory";

    function recordAnswer(questionId, isCorrect) {
      if (!questionId) return;
      try {
        const raw = localStorage.getItem(HISTORY_KEY);
        const history = raw ? JSON.parse(raw) : {};
        const entry = history[questionId] || { attempts: 0, correct: 0, last: null };
        entry.attempts += 1;
        if (isCorrect) entry.correct += 1;
        entry.last = new Date().toISOString();
        history[questionId] = entry;
        localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
      } catch (e) {
        // localStorage unavailable / quota / parse error — ignore, keep playing.
      }
    }

    // ===================================================================
    // DOM references
    // ===================================================================
    const appSubtitle = document.getElementById("app-subtitle");
    const progressWrapper = document.getElementById("progress-wrapper");

    const dashboardScreen = document.getElementById("dashboard-screen");
    const questionScreen = document.getElementById("question-screen");
    const resultsScreen = document.getElementById("results-screen");

    const latestDateEl = document.getElementById("latest-date");
    const latestTitleEl = document.getElementById("latest-title");
    const startLatestBtn = document.getElementById("start-latest-btn");
    const reviewCountSelect = document.getElementById("review-count");
    const startReviewBtn = document.getElementById("start-review-btn");
    const quizListEl = document.getElementById("quiz-list");

    const qNumElement = document.getElementById("screen-q-num");
    const qTextElement = document.getElementById("screen-q-text");
    const codeSnippet = document.getElementById("code-snippet");
    const choicesContainer = document.getElementById("choices-container");
    const explanationPanel = document.getElementById("explanation-panel");
    const explanationTitle = document.getElementById("explanation-title");
    const explanationText = document.getElementById("explanation-text");
    const actionContainer = document.getElementById("action-container");
    const nextBtn = document.getElementById("next-btn");

    const currentQMeta = document.getElementById("current-question-num");
    const scoreMeta = document.getElementById("score-meta");
    const progressBar = document.getElementById("progress-bar");

    const finalScore = document.getElementById("final-score");
    const finalAccuracy = document.getElementById("final-accuracy");
    const resultsAchievementText = document.getElementById("results-achievement-text");
    const retryBtn = document.getElementById("retry-btn");
    const homeBtn = document.getElementById("home-btn");

    // ===================================================================
    // Quiz session state
    // ===================================================================
    let quizData = [];        // array of question objects for the current session
    let currentIdx = 0;
    let score = 0;
    let answered = false;
    let currentSubtitle = ""; // subtitle to restore on retry
    let lastSession = null;   // { type, date } — to reproduce on retry

    // ===================================================================
    // Helpers
    // ===================================================================
    function shuffle(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function formatDate(d) {
      // "20260610" -> "2026.06.10"
      if (!d || d.length !== 8) return d;
      return `${d.slice(0, 4)}.${d.slice(4, 6)}.${d.slice(6, 8)}`;
    }

    // ===================================================================
    // Dashboard
    // ===================================================================
    function renderDashboard() {
      if (MANIFEST.length === 0) {
        latestDateEl.innerText = "";
        latestTitleEl.innerText = "クイズデータが見つかりません";
        startLatestBtn.disabled = true;
        return;
      }

      const latest = MANIFEST[MANIFEST.length - 1];
      latestDateEl.innerText = formatDate(latest.date);
      latestTitleEl.innerText = `${latest.title}（${latest.count}問）`;

      // Past quizzes, newest first.
      quizListEl.innerHTML = "";
      MANIFEST.slice().reverse().forEach((entry) => {
        const item = document.createElement("button");
        item.className = "quiz-list-item";
        item.innerHTML = `
          <span class="quiz-list-main">
            <span class="quiz-list-date">${formatDate(entry.date)}</span>
            <span class="quiz-list-title">${entry.title}</span>
          </span>
          <span class="quiz-list-count">${entry.count}問</span>
        `;
        item.addEventListener("click", () => startDailyQuiz(entry.date));
        quizListEl.appendChild(item);
      });

      lucide.createIcons();
    }

    function showDashboard() {
      dashboardScreen.style.display = "flex";
      questionScreen.style.display = "none";
      resultsScreen.style.display = "none";
      progressWrapper.style.display = "none";
      appSubtitle.innerText = "日々の学びを4択で振り返る";
      lucide.createIcons();
    }

    // ===================================================================
    // Start sessions
    // ===================================================================
    function startDailyQuiz(date) {
      const entry = MANIFEST.find(m => m.date === date);
      const title = entry ? entry.title : "";
      const count = entry ? entry.count : "";
      startLatestBtn.disabled = true;
      loadDataFile(date).then(() => {
        const data = window.QUIZ_DATA[date];
        if (!data || !data.questions) throw new Error("no questions");
        quizData = data.questions.slice();
        const subtitle = `${formatDate(date)} — ${data.title}についての${quizData.length}問`;
        lastSession = { type: "daily", date };
        startQuiz(subtitle);
      }).catch((e) => {
        alert(`クイズデータの読み込みに失敗しました: ${date}`);
      }).finally(() => {
        startLatestBtn.disabled = false;
      });
    }

    function startReviewQuiz() {
      const n = parseInt(reviewCountSelect.value, 10);
      startReviewBtn.disabled = true;
      // Load every data file, then build a global pool.
      Promise.all(MANIFEST.map(m => loadDataFile(m.date).catch(() => null)))
        .then(() => {
          let pool = [];
          MANIFEST.forEach(m => {
            const data = window.QUIZ_DATA[m.date];
            if (data && data.questions) pool = pool.concat(data.questions);
          });
          if (pool.length === 0) throw new Error("empty pool");

          let picked = shuffle(pool);
          if (n < picked.length) picked = picked.slice(0, n);

          // Shuffle choice order within each question (isCorrect drives grading).
          quizData = picked.map(q => Object.assign({}, q, { choices: shuffle(q.choices) }));

          const subtitle = `復習 — 全期間から${quizData.length}問`;
          lastSession = { type: "review", count: n };
          startQuiz(subtitle);
        })
        .catch(() => {
          alert("復習データの読み込みに失敗しました");
        })
        .finally(() => {
          startReviewBtn.disabled = false;
        });
    }

    function startQuiz(subtitle) {
      currentSubtitle = subtitle;
      currentIdx = 0;
      score = 0;
      appSubtitle.innerText = subtitle;
      dashboardScreen.style.display = "none";
      resultsScreen.style.display = "none";
      questionScreen.style.display = "flex";
      progressWrapper.style.display = "block";
      loadQuestion(currentIdx);
    }

    // ===================================================================
    // Quiz progression (reused from archive template, minimal changes)
    // ===================================================================
    function loadQuestion(idx) {
      answered = false;
      explanationPanel.style.display = "none";
      actionContainer.style.display = "none";

      const qData = quizData[idx];
      qNumElement.innerHTML = `Question ${idx + 1}`;
      qTextElement.innerHTML = qData.question;
      codeSnippet.innerHTML = qData.code;

      currentQMeta.innerText = `Question ${idx + 1} of ${quizData.length}`;
      scoreMeta.innerText = `Score: ${score} / ${idx}`;
      progressBar.style.width = `${(idx / quizData.length) * 100}%`;

      choicesContainer.innerHTML = "";
      qData.choices.forEach((choice, cIdx) => {
        const choiceCard = document.createElement("button");
        choiceCard.className = "choice-card";
        choiceCard.innerHTML = `
          <div class="choice-index">${String.fromCharCode(65 + cIdx)}</div>
          <div class="choice-content">${choice.text}</div>
        `;
        choiceCard.addEventListener("click", () => handleChoiceSelect(cIdx));
        choicesContainer.appendChild(choiceCard);
      });
    }

    function handleChoiceSelect(choiceIdx) {
      if (answered) return;
      answered = true;

      const qData = quizData[currentIdx];
      const selectedChoice = qData.choices[choiceIdx];
      const correctChoiceIdx = qData.choices.findIndex(c => c.isCorrect);

      const allChoiceCards = document.querySelectorAll(".choice-card");
      allChoiceCards.forEach((card, idx) => {
        card.classList.add("checked");
        if (idx === correctChoiceIdx) {
          card.classList.add("correct");
        } else if (idx === choiceIdx) {
          card.classList.add("incorrect");
        } else {
          card.classList.add("dimmed");
        }
      });

      const isCorrect = selectedChoice.isCorrect;

      // localStorage record (non-fatal).
      recordAnswer(qData.id, isCorrect);

      if (isCorrect) {
        score++;
        playConfetti(0.3);
        explanationTitle.className = "explanation-header correct-text";
        explanationTitle.innerHTML = `
          <i data-lucide="check-circle-2" style="color: var(--accent-success); width: 20px; height: 20px;"></i>
          <span>正解！素晴らしい理解です！</span>
        `;
      } else {
        explanationTitle.className = "explanation-header incorrect-text";
        explanationTitle.innerHTML = `
          <i data-lucide="x-circle" style="color: var(--accent-error); width: 20px; height: 20px;"></i>
          <span>惜しい！次は正解できます！</span>
        `;
      }

      explanationText.innerHTML = qData.explanation;
      explanationPanel.style.display = "block";
      actionContainer.style.display = "flex";

      scoreMeta.innerText = `Score: ${score} / ${currentIdx + 1}`;
      lucide.createIcons();
    }

    function playConfetti(scalar = 1) {
      confetti({
        particleCount: Math.floor(80 * scalar),
        spread: 70,
        origin: { y: 0.6 },
        colors: ['#6366f1', '#a855f7', '#10b981', '#fbbf24']
      });
    }

    function playMassiveConfetti() {
      const duration = 2.5 * 1000;
      const end = Date.now() + duration;

      (function frame() {
        confetti({ particleCount: 4, angle: 60, spread: 55, origin: { x: 0 }, colors: ['#6366f1', '#a855f7', '#10b981'] });
        confetti({ particleCount: 4, angle: 120, spread: 55, origin: { x: 1 }, colors: ['#6366f1', '#a855f7', '#10b981'] });
        if (Date.now() < end) requestAnimationFrame(frame);
      }());
    }

    nextBtn.addEventListener("click", () => {
      currentIdx++;
      if (currentIdx < quizData.length) {
        loadQuestion(currentIdx);
      } else {
        showResults();
      }
    });

    function showResults() {
      questionScreen.style.display = "none";
      resultsScreen.style.display = "flex";
      progressBar.style.width = "100%";
      currentQMeta.innerText = `Quiz Completed`;

      finalScore.innerText = `${score} / ${quizData.length}`;
      const accuracyPercent = Math.round((score / quizData.length) * 100);
      finalAccuracy.innerText = `${accuracyPercent}%`;

      if (accuracyPercent === 100) {
        resultsAchievementText.innerText = "パーフェクト！今日のHaskellの学びが完璧に身についています！🏆";
        playMassiveConfetti();
      } else if (accuracyPercent >= 60) {
        resultsAchievementText.innerText = "お見事！かなりHaskellの感覚が掴めてきていますね！✨";
        playConfetti(1);
      } else {
        resultsAchievementText.innerText = "お疲れ様でした！もう一度解き直して、エラーの挙動などを確認してみましょう！📚";
      }
      lucide.createIcons();
    }

    retryBtn.addEventListener("click", () => {
      // Reproduce the same session type. Review reshuffles a fresh pool.
      if (lastSession && lastSession.type === "review") {
        startReviewQuiz();
      } else {
        // daily: reuse the already-loaded quizData order
        startQuiz(currentSubtitle);
      }
    });

    homeBtn.addEventListener("click", showDashboard);

    startLatestBtn.addEventListener("click", () => {
      if (MANIFEST.length === 0) return;
      startDailyQuiz(MANIFEST[MANIFEST.length - 1].date);
    });
    startReviewBtn.addEventListener("click", startReviewQuiz);

    // ===================================================================
    // Init
    // ===================================================================
    renderDashboard();
    showDashboard();
    lucide.createIcons();
  </script>
</body>
</html>
