<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Haskell 今日の学びクイズ - 2026.05.25</title>
  
  <!-- プレミアムフォント -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  
  <!-- Lucide アイコン CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- 紙吹雪演出用ライブラリ -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    /* デザインシステム & リセット */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg-primary: #080c14;
      --bg-secondary: #0f172a;
      --bg-glass: rgba(15, 23, 42, 0.65);
      --bg-glass-hover: rgba(30, 41, 59, 0.8);
      --border-color: rgba(255, 255, 255, 0.08);
      --border-glow: rgba(99, 102, 241, 0.15);
      
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      
      --accent-primary: #6366f1; /* インディゴ */
      --accent-secondary: #a855f7; /* パープル */
      --accent-success: #10b981; /* エメラルド */
      --accent-error: #f43f5e; /* ローズ */
      
      --glow-accent: rgba(99, 102, 241, 0.25);
      --glow-success: rgba(16, 185, 129, 0.25);
      --glow-error: rgba(244, 63, 94, 0.25);
      
      --transition-smooth: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      position: relative;
      padding: 2rem 1rem;
    }

    /* 背景グラデーション演出 */
    body::before, body::after {
      content: '';
      position: absolute;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      background: radial-gradient(circle, var(--accent-primary) 0%, rgba(99, 102, 241, 0) 70%);
      opacity: 0.15;
      z-index: -1;
      filter: blur(80px);
      pointer-events: none;
    }

    body::before {
      top: -10%;
      left: -10%;
    }

    body::after {
      bottom: -10%;
      right: -10%;
      background: radial-gradient(circle, var(--accent-secondary) 0%, rgba(168, 85, 247, 0) 70%);
      opacity: 0.12;
    }

    .app-container {
      width: 100%;
      max-width: 680px;
      z-index: 10;
    }

    /* ヘッダー */
    header {
      text-align: center;
      margin-bottom: 2rem;
      animation: fadeInDown 0.6s ease-out;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.15) 0%, rgba(168, 85, 247, 0.15) 100%);
      border: 1px solid rgba(99, 102, 241, 0.3);
      padding: 0.4rem 1rem;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      color: #a5b4fc;
      margin-bottom: 1rem;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.1);
      backdrop-filter: blur(10px);
    }

    h1 {
      font-size: 2.2rem;
      font-weight: 800;
      line-height: 1.25;
      background: linear-gradient(135deg, #ffffff 30%, #c7d2fe 70%, #e0a7ff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.5rem;
      letter-spacing: -0.02em;
    }

    .subtitle {
      color: var(--text-secondary);
      font-size: 1rem;
    }

    /* プログレスバー */
    .progress-wrapper {
      margin-bottom: 1.5rem;
      animation: fadeIn 0.8s ease-out;
    }

    .progress-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.5rem;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-secondary);
    }

    .progress-bar-container {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.03);
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent-primary) 0%, var(--accent-secondary) 100%);
      border-radius: 10px;
      transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 0 12px var(--accent-primary);
    }

    /* メインカード */
    .card {
      background: var(--bg-glass);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border-color);
      border-radius: 24px;
      padding: 2.5rem;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.05);
      position: relative;
      overflow: hidden;
      transition: var(--transition-smooth);
      margin-bottom: 1.5rem;
      min-height: 380px;
      display: flex;
      flex-direction: column;
    }

    .question-screen {
      display: flex;
      flex-direction: column;
      height: 100%;
      flex-grow: 1;
    }

    .question-number {
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--accent-secondary);
      margin-bottom: 0.75rem;
    }

    .question-text {
      font-size: 1.25rem;
      font-weight: 700;
      line-height: 1.5;
      margin-bottom: 1.5rem;
      color: var(--text-primary);
    }

    /* コードブロック */
    pre {
      background: #090d16;
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      padding: 1.2rem;
      margin-bottom: 1.5rem;
      overflow-x: auto;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.9rem;
      line-height: 1.6;
      color: #e2e8f0;
      position: relative;
      box-shadow: inset 0 2px 8px rgba(0,0,0,0.5);
    }

    .code-lang {
      position: absolute;
      top: 6px;
      right: 12px;
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    /* 選択肢リスト */
    .choices-list {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0.85rem;
      margin-bottom: 1.5rem;
    }

    .choice-card {
      background: rgba(255, 255, 255, 0.02);
      border: 1.5px solid var(--border-color);
      border-radius: 16px;
      padding: 1rem 1.25rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      cursor: pointer;
      font-weight: 600;
      color: var(--text-primary);
      transition: var(--transition-smooth);
      position: relative;
      text-align: left;
      outline: none;
    }

    .choice-card:hover:not(.checked) {
      background: var(--bg-glass-hover);
      border-color: var(--accent-primary);
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(99, 102, 241, 0.15);
    }

    .choice-index {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-secondary);
      flex-shrink: 0;
    }

    .choice-card:hover:not(.checked) .choice-index {
      background: var(--accent-primary);
      border-color: var(--accent-primary);
      color: white;
    }

    /* 正解・不正解ステート */
    .choice-card.correct {
      background: rgba(16, 185, 129, 0.1);
      border-color: var(--accent-success);
      box-shadow: 0 8px 24px var(--glow-success);
    }

    .choice-card.correct .choice-index {
      background: var(--accent-success);
      border-color: var(--accent-success);
      color: white;
    }

    .choice-card.incorrect {
      background: rgba(244, 63, 94, 0.08);
      border-color: var(--accent-error);
      box-shadow: 0 8px 24px var(--glow-error);
      opacity: 0.7;
    }

    .choice-card.incorrect .choice-index {
      background: var(--accent-error);
      border-color: var(--accent-error);
      color: white;
    }

    .choice-card.dimmed {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* 解説パネル */
    .explanation-panel {
      margin-top: 1.5rem;
      background: rgba(255, 255, 255, 0.02);
      border: 1px dashed rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 1.25rem;
      animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      display: none;
    }

    .explanation-header {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }

    .explanation-header.correct-text { color: var(--accent-success); }
    .explanation-header.incorrect-text { color: var(--accent-error); }

    .explanation-body {
      font-size: 0.9rem;
      line-height: 1.6;
      color: var(--text-secondary);
    }

    /* アクションボタン */
    .action-container {
      margin-top: auto;
      display: flex;
      justify-content: flex-end;
      padding-top: 1rem;
    }

    .btn {
      background: linear-gradient(135deg, var(--accent-primary) 0%, var(--accent-secondary) 100%);
      border: none;
      color: white;
      padding: 0.85rem 1.8rem;
      border-radius: 14px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      transition: var(--transition-smooth);
      box-shadow: 0 8px 20px rgba(99, 102, 241, 0.3);
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(99, 102, 241, 0.45);
    }

    /* 結果画面 */
    .results-screen {
      text-align: center;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      animation: scaleIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .trophy-icon {
      color: #eab308;
      width: 72px;
      height: 72px;
      filter: drop-shadow(0 4px 12px rgba(234, 179, 8, 0.4));
      margin-bottom: 1.5rem;
    }

    .results-title {
      font-size: 1.8rem;
      font-weight: 800;
      margin-bottom: 0.5rem;
      background: linear-gradient(135deg, #ffffff, #c7d2fe);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .results-stats {
      display: flex;
      gap: 1.5rem;
      margin: 1.5rem 0;
    }

    .stat-box {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 1rem 1.5rem;
      min-width: 120px;
    }

    .stat-val {
      font-size: 1.8rem;
      font-weight: 800;
      color: var(--accent-primary);
    }

    .stat-val.success-color { color: var(--accent-success); }

    .stat-lbl {
      font-size: 0.8rem;
      color: var(--text-secondary);
      font-weight: 600;
      text-transform: uppercase;
    }

    .results-message {
      color: var(--text-secondary);
      font-size: 1rem;
      margin-bottom: 2rem;
      max-width: 440px;
    }

    /* シンタックスハイライト風のカラー */
    .keyword { color: #f472b6; font-weight: bold; }
    .comment { color: #64748b; font-style: italic; }

    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes scaleIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    footer {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.8rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <div class="app-container">
    
    <header>
      <div class="badge">
        <i data-lucide="book-open" style="width: 14px; height: 14px;"></i>
        <span>Haskell Learning Review</span>
      </div>
      <h1>今日の学びクイズ</h1>
      <p class="subtitle">2026.05.25 — リスト・レンジ・型についての3問</p>
    </header>

    <div class="progress-wrapper">
      <div class="progress-meta">
        <span id="current-question-num">Question 1 of 3</span>
        <span id="score-meta">Score: 0 / 0</span>
      </div>
      <div class="progress-bar-container">
        <div class="progress-bar-fill" id="progress-bar"></div>
      </div>
    </div>

    <div class="card" id="quiz-card">
      
      <!-- クイズ画面 -->
      <div class="question-screen" id="question-screen">
        <div class="question-number" id="screen-q-num">Question 1</div>
        <div class="question-text" id="screen-q-text">質問テキスト</div>
        
        <pre><div class="code-lang">haskell</div><code id="code-snippet">コード</code></pre>

        <div class="choices-list" id="choices-container"></div>

        <!-- 解説パネル -->
        <div class="explanation-panel" id="explanation-panel">
          <div class="explanation-header" id="explanation-title"></div>
          <div class="explanation-body" id="explanation-text"></div>
        </div>

        <div class="action-container" id="action-container" style="display: none;">
          <button class="btn" id="next-btn">
            <span>Next Question</span>
            <i data-lucide="arrow-right" style="width: 18px; height: 18px;"></i>
          </button>
        </div>
      </div>

      <!-- 結果画面 -->
      <div class="results-screen" id="results-screen">
        <i data-lucide="trophy" class="trophy-icon"></i>
        <h2 class="results-title">Quiz Completed!</h2>
        <p class="results-message" id="results-achievement-text">素晴らしい！今日のHaskellの学びが身についています！</p>
        
        <div class="results-stats">
          <div class="stat-box">
            <div class="stat-val success-color" id="final-score">3 / 3</div>
            <div class="stat-lbl">正解数</div>
          </div>
          <div class="stat-box">
            <div class="stat-val" id="final-accuracy">100%</div>
            <div class="stat-lbl">正解率</div>
          </div>
        </div>

        <button class="btn" id="retry-btn">
          <i data-lucide="rotate-ccw" style="width: 18px; height: 18px;"></i>
          <span>もう一度挑戦する</span>
        </button>
      </div>

    </div>

    <footer>
      <p>Created by Antigravity | Pair programming with Suzuki Wataru</p>
    </footer>

  </div>

  <script>
    // クイズのデータ
    const quizData = [
      {
        qNumText: "Question 1",
        question: "Haskellで「20から1までの減少列」を作りたいとき、以下のレンジ評価結果はそれぞれどうなりますか？",
        code: `<span class="comment">-- 1. ステップなしでレンジを書いた場合</span>
<span class="keyword">ghci&gt;</span> [20..1]

<span class="comment">-- 2. ステップありで減少を指定した場合</span>
<span class="keyword">ghci&gt;</span> [20, 19..1]`,
        choices: [
          { text: "1. <code>[20, 19..1]</code> / 2. <code>[20, 19..1]</code> (両方とも減少列になる)", isCorrect: false },
          { text: "1. <code>[]</code> (空リスト) / 2. <code>[20,19,18..1]</code> (減少列になる)", isCorrect: true },
          { text: "1. <code>[20,19,18..1]</code> (減少列になる) / 2. <code>[]</code> (空リスト)", isCorrect: false },
          { text: "どちらもコンパイルエラーになる", isCorrect: false }
        ],
        explanation: "Haskellではステップなしで <code>[20..1]</code> のようにレンジを書いた場合、自動的に「1ずつ増加させる」と解釈されます。開始値の <code>20</code> はすでに終了値の <code>1</code> より大きいため、結果は <strong>空リスト <code>[]</code></strong> になります。減少させるには、<code>[20, 19..1]</code> のように最初の2つの値を指定してステップが <code>-1</code> であることを明示する必要があります。"
      },
      {
        qNumText: "Question 2",
        question: "リスト <code>[5, 4, 3, 2, 1]</code> に対する <code>tail</code> と <code>init</code> の結果、および空リスト <code>[]</code> にこれらを適用した時の挙動はどうなるでしょうか？",
        code: `<span class="comment">-- 1. tail を適用</span>
<span class="keyword">ghci&gt;</span> tail [5, 4, 3, 2, 1]

<span class="comment">-- 2. init を適用</span>
<span class="keyword">ghci&gt;</span> init [5, 4, 3, 2, 1]

<span class="comment">-- 3. 空リストに head などを適用</span>
<span class="keyword">ghci&gt;</span> head []`,
        choices: [
          { text: "1. <code>[4,3,2,1]</code> / 2. <code>[5,4,3,2]</code> / 空リストはランタイムエラーになる", isCorrect: true },
          { text: "1. <code>[5,4,3,2]</code> / 2. <code>[4,3,2,1]</code> / 空リストは <code>[]</code> が返る", isCorrect: false },
          { text: "1. <code>[4,3,2,1]</code> / 2. <code>[5,4,3,2]</code> / 空リストは <code>[]</code> が返る", isCorrect: false },
          { text: "すべて評価中にコンパイルエラーになる", isCorrect: false }
        ],
        explanation: "<code>tail</code> は「最初の要素を除いた残りのリスト」を返すため <code>[4,3,2,1]</code> に。<code>init</code> は「最後の要素を除いた残りのリスト」を返すため <code>[5,4,3,2]</code> になります。また、Haskellでは安全を考慮し、空リスト <code>[]</code> に対する <code>head</code>, <code>tail</code>, <code>init</code>, <code>last</code>, <code>maximum</code> などの操作はデフォルトで <strong>ランタイムエラー</strong> になりプログラムが停止します。"
      },
      {
        qNumText: "Question 3",
        question: "文字リストと文字列の結合についての問題です。以下の2つの式の評価結果はそれぞれ何になるでしょうか？",
        code: `<span class="comment">-- 1. シングルクォートで定義したリストの連結</span>
<span class="keyword">ghci&gt;</span> ['w', 'o'] ++ ['o', 't']

<span class="comment">-- 2. ダブルクォートで定義したリストの連結</span>
<span class="keyword">ghci&gt;</span> ["w", "o"] ++ ["o", "d"]`,
        choices: [
          { text: "1. <code>[\"w\",\"o\",\"o\",\"t\"]</code> / 2. <code>\"wood\"</code>", isCorrect: false },
          { text: "1. <code>\"woot\"</code> / 2. <code>[\"w\",\"o\",\"o\",\"d\"]</code>", isCorrect: true },
          { text: "1. <code>\"woot\"</code> / 2. <code>\"wood\"</code> (両方とも通常の文字列になる)", isCorrect: false },
          { text: "どちらも型エラーになり結合できない", isCorrect: false }
        ],
        explanation: "Haskellでは <strong><code>String</code>（文字列）は単なる文字型 <code>Char</code> のリスト（<code>[Char]</code>）のエイリアス</strong> です。そのため、シングルクォート文字のリスト連結は <code>\"woot\"</code> になります。一方、ダブルクォートで囲まれたものはすでに文字列リスト <code>[String]</code> (＝ <code>[[Char]]</code>) のため、それらを連結すると文字列の要素リスト <code>[\"w\",\"o\",\"o\",\"d\"]</code> になります！"
      }
    ];

    let currentIdx = 0;
    let score = 0;
    let answered = false;

    const qNumElement = document.getElementById("screen-q-num");
    const qTextElement = document.getElementById("screen-q-text");
    const codeSnippet = document.getElementById("code-snippet");
    const choicesContainer = document.getElementById("choices-container");
    const explanationPanel = document.getElementById("explanation-panel");
    const explanationTitle = document.getElementById("explanation-title");
    const explanationText = document.getElementById("explanation-text");
    const actionContainer = document.getElementById("action-container");
    const nextBtn = document.getElementById("next-btn");
    
    const currentQMeta = document.getElementById("current-question-num");
    const scoreMeta = document.getElementById("score-meta");
    const progressBar = document.getElementById("progress-bar");
    
    const resultsScreen = document.getElementById("results-screen");
    const questionScreen = document.getElementById("question-screen");
    const finalScore = document.getElementById("final-score");
    const finalAccuracy = document.getElementById("final-accuracy");
    const resultsAchievementText = document.getElementById("results-achievement-text");
    const retryBtn = document.getElementById("retry-btn");

    lucide.createIcons();

    function loadQuestion(idx) {
      answered = false;
      explanationPanel.style.display = "none";
      actionContainer.style.display = "none";
      
      const qData = quizData[idx];
      qNumElement.innerHTML = qData.qNumText;
      qTextElement.innerHTML = qData.question;
      codeSnippet.innerHTML = qData.code;
      
      currentQMeta.innerText = `Question ${idx + 1} of ${quizData.length}`;
      scoreMeta.innerText = `Score: ${score} / ${idx}`;
      progressBar.style.width = `${(idx / quizData.length) * 100}%`;

      choicesContainer.innerHTML = "";
      qData.choices.forEach((choice, cIdx) => {
        const choiceCard = document.createElement("button");
        choiceCard.className = "choice-card";
        choiceCard.innerHTML = `
          <div class="choice-index">${String.fromCharCode(65 + cIdx)}</div>
          <div class="choice-content">${choice.text}</div>
        `;
        choiceCard.addEventListener("click", () => handleChoiceSelect(cIdx));
        choicesContainer.appendChild(choiceCard);
      });
    }

    function handleChoiceSelect(choiceIdx) {
      if (answered) return;
      answered = true;

      const qData = quizData[currentIdx];
      const selectedChoice = qData.choices[choiceIdx];
      const correctChoiceIdx = qData.choices.findIndex(c => c.isCorrect);

      const allChoiceCards = document.querySelectorAll(".choice-card");
      allChoiceCards.forEach((card, idx) => {
        card.classList.add("checked");
        if (idx === correctChoiceIdx) {
          card.classList.add("correct");
        } else if (idx === choiceIdx) {
          card.classList.add("incorrect");
        } else {
          card.classList.add("dimmed");
        }
      });

      const isCorrect = selectedChoice.isCorrect;
      if (isCorrect) {
        score++;
        playConfetti(0.3);
        explanationTitle.className = "explanation-header correct-text";
        explanationTitle.innerHTML = `
          <i data-lucide="check-circle-2" style="color: var(--accent-success); width: 20px; height: 20px;"></i>
          <span>正解！素晴らしい理解です！</span>
        `;
      } else {
        explanationTitle.className = "explanation-header incorrect-text";
        explanationTitle.innerHTML = `
          <i data-lucide="x-circle" style="color: var(--accent-error); width: 20px; height: 20px;"></i>
          <span>惜しい！次は正解できます！</span>
        `;
      }

      explanationText.innerHTML = qData.explanation;
      explanationPanel.style.display = "block";
      actionContainer.style.display = "flex";
      
      scoreMeta.innerText = `Score: ${score} / ${currentIdx + 1}`;
      lucide.createIcons();
    }

    function playConfetti(scalar = 1) {
      confetti({
        particleCount: Math.floor(80 * scalar),
        spread: 70,
        origin: { y: 0.6 },
        colors: ['#6366f1', '#a855f7', '#10b981', '#fbbf24']
      });
    }

    function playMassiveConfetti() {
      const duration = 2.5 * 1000;
      const end = Date.now() + duration;

      (function frame() {
        confetti({ particleCount: 4, angle: 60, spread: 55, origin: { x: 0 }, colors: ['#6366f1', '#a855f7', '#10b981'] });
        confetti({ particleCount: 4, angle: 120, spread: 55, origin: { x: 1 }, colors: ['#6366f1', '#a855f7', '#10b981'] });
        if (Date.now() < end) requestAnimationFrame(frame);
      }());
    }

    nextBtn.addEventListener("click", () => {
      currentIdx++;
      if (currentIdx < quizData.length) {
        loadQuestion(currentIdx);
      } else {
        showResults();
      }
    });

    function showResults() {
      questionScreen.style.display = "none";
      resultsScreen.style.display = "flex";
      progressBar.style.width = "100%";
      currentQMeta.innerText = `Quiz Completed`;
      
      finalScore.innerText = `${score} / ${quizData.length}`;
      const accuracyPercent = Math.round((score / quizData.length) * 100);
      finalAccuracy.innerText = `${accuracyPercent}%`;

      if (accuracyPercent === 100) {
        resultsAchievementText.innerText = "パーフェクト！今日のHaskellの学びが完璧に身についています！🏆";
        playMassiveConfetti();
      } else if (accuracyPercent >= 60) {
        resultsAchievementText.innerText = "お見事！かなりHaskellの感覚が掴めてきていますね！✨";
        playConfetti(1);
      } else {
        resultsAchievementText.innerText = "お疲れ様でした！もう一度解き直して、エラーの挙動などを確認してみましょう！📚";
      }
    }

    retryBtn.addEventListener("click", () => {
      currentIdx = 0;
      score = 0;
      questionScreen.style.display = "flex";
      resultsScreen.style.display = "none";
      loadQuestion(currentIdx);
    });

    loadQuestion(currentIdx);
  </script>
</body>
</html>
